services:
  db:
    image: mysql:8.0
    container_name: mysql_kardex_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?define MYSQL_ROOT_PASSWORD en .env}
      MYSQL_DATABASE: db_kardex
      MYSQL_USER: grupo3
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?define MYSQL_PASSWORD en .env}
    ports:
      - "127.0.0.1:33061:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - kardex-net

  phpmyadmin:
    image: phpmyadmin:5
    profiles: ["diagnostico"]
    container_name: phpmyadmin_kardex
    restart: always
    ports:
      - "127.0.0.1:8080:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?define MYSQL_ROOT_PASSWORD en .env}
    depends_on:
      - db
    networks:
      - kardex-net

  web:
    build: .
    container_name: fastapi_kardex_app
    restart: always
    ports:
      - "8001:8000"
    environment:
      - DATABASE_URL=mysql+pymysql://grupo3:${MYSQL_PASSWORD:?define MYSQL_PASSWORD en .env}@db:3306/db_kardex
      - SECRET_KEY=${SECRET_KEY:-}
      - TOKEN_EXPIRE_MINUTES=${TOKEN_EXPIRE_MINUTES:-480}
      - DEMO_DATA=${DEMO_DATA:-false}
    depends_on:
      - db
    networks:
      - kardex-net

volumes:
  mysql_data:

networks:
  kardex-net:
    driver: bridge
