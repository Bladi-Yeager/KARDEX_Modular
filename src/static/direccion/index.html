<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Consulta de la empresa · Kardex agrícola</title><style>
*{box-sizing:border-box}body{margin:0;background:#f4f6ef;color:#19362f;font:16px/1.55 "DM Sans",system-ui,sans-serif}header,main{max-width:1180px;margin:auto;padding:20px clamp(16px,4vw,48px)}header{display:flex;justify-content:space-between;border-bottom:1px solid #c9d5c7}a{color:#215448}h1,h2,h3{line-height:1.12}h1{font:normal clamp(34px,5vw,58px)/1.03 Georgia,serif;margin:.25em 0}h2{font-size:24px}p{max-width:76ch}.hero{background:#183e35;color:#fff8df;border-radius:16px;padding:clamp(18px,4vw,38px)}.hero p{margin-bottom:0}.card,form,.tiles>div{background:white;border:1px solid #cad6ca;border-radius:12px;padding:18px;margin:16px 0}.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}.tiles>div{margin-bottom:0;border-top:4px solid #4a7e67}.tiles strong{display:block;font-size:24px}.tools{display:flex;align-items:center;flex-wrap:wrap;gap:12px;margin:16px 0}button,select,input{font:inherit;padding:9px 13px;border-radius:7px;border:1px solid #8da99c}button{cursor:pointer;background:#215544;color:white}form{max-width:450px}form label{display:block;margin:10px 0}input{width:100%}table{width:100%;border-collapse:collapse}th,td{padding:9px;text-align:left;border-bottom:1px solid #dce4db}.scroll{overflow:auto}.warn{color:#833318}.ok{color:#226844}[hidden]{display:none!important}
</style><header><b>Kardex agrícola</b><a href="/">Centro de accesos</a></header><main><div class="hero"><h1 id="title">Dirección de la empresa</h1><p id="sub">Ganancias, pérdidas e incidencias del acopio.</p></div><form id="login"><h2>Iniciar sesión</h2><label>Usuario<input name="username" autocomplete="username" required></label><label>Contraseña<input name="password" type="password" autocomplete="current-password" required></label><button>Entrar</button></form><p id="msg" role="status"></p><section id="panel" hidden><div class="tools"><label id="period">Período <select id="days"><option value="7">7 días</option><option selected value="30">30 días</option><option value="90">90 días</option></select></label><button id="reload">Actualizar</button><button id="excel">Descargar Excel por lote</button><button id="logout">Cerrar sesión</button></div><div id="report"></div></section></main><script>
const $=id=>document.getElementById(id),role=location.pathname==='/soporte'?'soporte':'jefe';
let token=sessionStorage.getItem('consulta_token'),revision=0;
const fmt=n=>new Intl.NumberFormat('es-BO',{maximumFractionDigits:2}).format(n);
const bs=n=>n==null?'Pendiente':'Bs '+fmt(n);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function table(cols,rows,empty){return rows.length?'<div class="scroll"><table><thead><tr>'+cols.map(c=>'<th>'+esc(c)+'</th>').join('')+'</tr></thead><tbody>'+rows.map(row=>'<tr>'+row.map(c=>'<td>'+esc(c)+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>':'<p>'+empty+'</p>'}
function card(title,body){return '<section class="card"><h2>'+title+'</h2>'+body+'</section>'}
function end(){revision++;sessionStorage.removeItem('consulta_token');token=null;$('panel').hidden=true;$('report').textContent='';$('login').hidden=false;}
async function api(url,options={}){const r=await fetch(url,{...options,headers:{'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{})}});if(!r.ok){const e=await r.json().catch(()=>({}));if(r.status===401)end();throw Error(e.detail||'Consulta no disponible')}return r}
const tile=(label,value)=>'<div>'+label+'<strong>'+value+'</strong></div>';
function draw(d){const a=d.actual,b=d.anterior,valid=a.resultado!=null&&b.resultado!=null;
const explain=!a.actividad?'Sin actividad registrada para el período seleccionado.':a.resultado==null?'Hay lotes activos con costos pendientes. El resultado total queda pendiente.':a.resultado<0?'Los costos registrados superaron las ventas en '+bs(-a.resultado)+'.':'Las ventas cubrieron los costos registrados. Margen: '+bs(a.resultado)+'.';
let comparison='<p>Actual: '+a.desde+' al '+a.hasta+'. Anterior: '+b.desde+' al '+b.hasta+'.</p>';
if(valid){let delta=a.resultado-b.resultado;comparison+='<p><b>El margen '+(delta<0?'bajó en '+bs(-delta):delta>0?'subió en '+bs(delta):'se mantuvo')+'.</b> La tabla desglosa el aporte de cada componente.</p>'}else comparison+='<p>La variación del margen requiere actividad y costos completos en ambos períodos.</p>';
comparison+=table(['Componente','Actual','Anterior','Efecto sobre el margen'],[['Ventas','ventas',1],['Costo de salidas','costo',-1],['Otros gastos','gastos',-1]].map(([t,k,sign])=>[t,bs(a[k]),bs(b[k]),a[k]==null||b[k]==null||!b.actividad||!a.actividad?'—':bs(sign*(a[k]-b[k]))]),'');
const conceptos=[...new Set([...Object.keys(a.conceptos),...Object.keys(b.conceptos)])].map(k=>[k,a.conceptos[k]||0,b.conceptos[k]||0]).sort((x,y)=>(y[1]-y[2])-(x[1]-x[2]));
const lots=[...a.lotes].sort((x,y)=>(x.resultado??Infinity)-(y.resultado??Infinity));
$('report').innerHTML='<div class="tiles">'+tile('Resultado del período',a.actividad?bs(a.resultado):'Sin actividad')+tile('Resultado anterior',b.actividad?bs(b.resultado):'Sin actividad')+tile('Lotes con pérdida',lots.filter(l=>l.resultado!=null&&l.resultado<0).length)+tile('Lotes con datos pendientes',d.pendientes.length)+'</div>'+card('Qué cambió','<p>'+explain+'</p>'+comparison)+card('Resultado de los lotes con actividad',table(['Lote','Producto','Ventas','Costo de salidas','Otros gastos','Margen'],lots.map(l=>[l.codigo,l.producto,bs(l.ventas),bs(l.costo),bs(l.gastos),bs(l.resultado)]),'Sin lotes con movimientos o registros financieros en este período.')+'<p>El costo incluye las salidas por merma. Gastos generales sin lote: '+bs(a.generales)+'.</p>')+card('En qué se gastó',table(['Concepto registrado','Actual','Anterior'],conceptos.map(([k,x,y])=>[k,bs(x),bs(y)]),'Sin gastos adicionales registrados en los períodos comparados.'))+card('Motivos registrados en campo',table(['Fecha','Lote','Incidencia','Cantidad','Motivo declarado'],d.hechos.map(h=>[h.fecha,h.lote,h.tipo,fmt(h.cantidad)+' '+h.unidad,h.motivo]),'Sin rechazos ni mermas vigentes registrados en este período.')+'<p>Los motivos provienen de la recepción y del registro de mermas. Para atribuir una caída a la fertilización o a la técnica de cosecha hace falta una observación que lo sustente.</p>')+card('Rendimiento aceptado por parcela',table(['Parcela','Producto','Unidad','Actual','Anterior','Variación'],d.campo.rendimientos.map(r=>[r.parcela,r.producto,r.unidad+'/ha',r.actual==null?'—':fmt(r.actual),r.anterior==null?'—':fmt(r.anterior),r.cambio_pct==null?'Sin base comparable':fmt(r.cambio_pct)+' %']),'Sin cosechas con superficie registrada en estos períodos.')+'<p>Cantidad aceptada dividida entre la suma de hectáreas cosechadas en los cortes registrados. Cada producto y presentación se compara por separado.</p>')+card('Bitácora de campo del período',table(['Fecha','Parcela','Actividad','Descripción','Registro'],d.campo.actividades.map(r=>[r.fecha,r.parcela,r.tipo,r.detalle,r.insumo ? r.insumo+' · '+r.dosis+' '+r.unidad_dosis : r.lote ? r.lote+' · '+r.area_ha+' ha' : '—']),'Sin anotaciones en el período.'))+card('Datos por completar',table(['Lote','Dato pendiente'],d.pendientes.map(l=>[l.codigo,l.motivo]),'Todos los lotes al corte tienen los datos necesarios para calcular su resultado.'))}
async function load(){const id=++revision;$('msg').textContent='Consultando…';$('report').textContent='';try{let d=await (await api(role==='jefe'?'/direccion/resumen?dias='+$('days').value:'/reportes/diagnostico')).json();if(id!==revision)return;if(role==='jefe')draw(d);else $('report').innerHTML=card('Servicios',table(['Componente','Estado'],d.map(r=>[r.componente,r.estado]),'Sin datos'));$('msg').textContent=''}catch(e){$('msg').textContent=e.message}}
async function openPanel(){const u=await(await api('/auth/me')).json();if(u.rol!==role){end();throw Error('Esta cuenta no corresponde a este acceso.')} $('login').hidden=true;$('panel').hidden=false;await load()}
$('login').onsubmit=async e=>{e.preventDefault();try{const data=Object.fromEntries(new FormData(e.target));const r=await(await api('/auth/login',{method:'POST',body:JSON.stringify(data)})).json();if(r.usuario.rol!==role)throw Error('Utiliza el acceso de tu rol desde el centro de accesos.');token=r.access_token;sessionStorage.setItem('consulta_token',token);e.target.reset();await openPanel()}catch(err){$('msg').textContent=err.message}};
$('excel').onclick=async()=>{try{const r=await api('/reportes/excel/resultado-lotes');const url=URL.createObjectURL(await r.blob());const a=document.createElement('a');a.href=url;a.download='Resultados-acumulados-al-corte.xlsx';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}catch(e){$('msg').textContent=e.message}};
$('excel').textContent='Excel acumulado al corte';$('reload').onclick=load;$('days').onchange=load;$('logout').onclick=()=>{end();$('msg').textContent=''};
if(role==='soporte'){$('title').textContent='Diagnóstico técnico';$('sub').textContent='Estado de los servicios de la instalación.';$('period').hidden=true;$('excel').textContent='Descargar diagnóstico';$('excel').onclick=async()=>{try{const r=await api('/reportes/excel/diagnostico');const u=URL.createObjectURL(await r.blob()),a=document.createElement('a');a.href=u;a.download='diagnostico.xlsx';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}catch(e){$('msg').textContent=e.message}}}
if(token)openPanel().catch(e=>$('msg').textContent=e.message);
</script></html>
