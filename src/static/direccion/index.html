<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dirección · Kardex agrícola</title><style>
:root {
  color-scheme: light;
  --canvas:#f2f5f9; --surface:#fff; --subtle:#eaf0f7; --ink:#192d46; --muted:#465971;
  --line:#c6d1dd; --field-line:#708399; --action:#234b78; --hover:#17385d; --button-ink:#fff;
  --gain:#164f91; --loss:#9d342f; --negative-bg:#fff4f2; --focus:#2769b3;
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --canvas:#101925; --surface:#1a2839; --subtle:#24364b; --ink:#eff4fb; --muted:#bac8d9;
  --line:#42566e; --field-line:#8295ab; --action:#b5d4ff; --hover:#d3e5ff; --button-ink:#132942;
  --gain:#a3ccff; --loss:#ffb0a5; --negative-bg:#36292e; --focus:#9ac5ff;
}
* {box-sizing:border-box}
[hidden] {display:none!important}
body {margin:0;background:var(--canvas);color:var(--ink);font:700 1rem/1.55 "DM Sans",system-ui,sans-serif}
header,main {max-width:1180px;margin:auto;padding:20px clamp(16px,4vw,48px)}
header,.tools,.query {display:flex;align-items:center;flex-wrap:wrap;gap:12px}
header {border-bottom:1px solid var(--line)}
header b {margin-right:auto}
a,.gain,.ok,.positive {color:var(--gain)}
.loss,.warn,.negative {color:var(--loss)}
h1,h2,h3 {font-weight:800;line-height:1.15}
h1,.summary-grid h2,.reporthead h2 {font-family:Georgia,serif}
h1 {font-size:clamp(32px,5vw,58px);margin:.15em 0}
h2 {font-size:24px}
p {max-width:76ch}
.hero {color:#fff;background:linear-gradient(112deg,#142a44,#2c4a6e);border-left:5px solid #829dbf;border-radius:16px;padding:clamp(18px,4vw,38px)}
button,input,select {font:inherit;padding:9px 13px;border-radius:7px;border:1px solid var(--field-line);color:var(--ink);background:var(--surface)}
button {cursor:pointer;background:var(--action);border-color:var(--action);color:var(--button-ink)}
button:hover {background:var(--hover)}
button:disabled {cursor:default;background:var(--subtle);color:var(--muted);border-color:var(--line)}
:focus-visible {outline:3px solid var(--focus);outline-offset:3px}
.card,form,.tiles>div,.summary-grid article {background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px}
.card,form,.tools {margin:16px 0}
.card h2 {font-size:21px}
form {max-width:450px}
form label {display:block;margin:10px 0}
input {width:100%}
.summary-grid {display:grid;grid-template-columns:1.15fr 1fr;gap:16px;align-items:start}
.summary-grid article {min-width:0;border-radius:14px;padding:clamp(16px,3vw,30px)}
article.monthly {border-top:5px solid var(--gain)}
article.daily {border-top:5px solid var(--field-line)}
.summary-grid h2 {font-size:clamp(24px,3vw,36px);margin:0 0 8px}
.summary-grid p {margin:.65rem 0}
.balance {display:block;font-size:clamp(24px,3.4vw,44px);font-weight:800;line-height:1.15;font-variant-numeric:tabular-nums}
.balance.pending,.comparison dt,.dates,.reporthead small,.casegrid small {color:var(--muted)}
.comparison {display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:18px 0}
.comparison dt,.dates,.query label {font-size:.9rem}
.comparison dd {margin:3px 0}
.query {align-items:end;margin:14px 0}
.query label {display:grid;gap:3px;min-width:0}
.query input {width:auto;max-width:100%}
.reporthead {margin-top:25px}
.reporthead h2 {font-size:clamp(26px,4vw,38px);margin:3px 0}
.reporthead p {margin:3px 0}
.reporthead small,.casegrid small {letter-spacing:.08em}
.tiles,.casegrid {display:grid;gap:12px}
.tiles {grid-template-columns:repeat(auto-fit,minmax(min(170px,100%),1fr))}
.tiles>div {border-top:4px solid var(--field-line)}
.tiles>div:first-child,.tiles>div:last-child {background:var(--subtle);border-top-color:var(--gain)}
.tiles strong {display:block;font-size:24px}
.casegrid {grid-template-columns:repeat(auto-fit,minmax(min(240px,100%),1fr));margin-bottom:18px}
.casegrid section {background:var(--subtle);border-left:4px solid var(--gain);border-radius:6px;padding:14px}
.casegrid section.negativa {background:var(--negative-bg);border-color:var(--loss)}
.casegrid h3 {margin:8px 0}
.casegrid p {font-size:.96rem}
.analysis {border-left:3px solid var(--field-line);padding-left:12px}
.scroll {max-width:100%;overflow:auto}
table {width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th,td {padding:9px;text-align:left;border-bottom:1px solid var(--line)}
th {background:var(--subtle);font-weight:800}
@media(max-width:760px) {
  .summary-grid {grid-template-columns:1fr}
  .comparison {gap:8px}
}
</style><header><b>Kardex agrícola · Dirección</b><a href="/">Centro de accesos</a><button id="theme" type="button">Tema oscuro</button></header><main><div class="hero"><h1 id="title">Resumen financiero</h1></div><form id="login"><h2>Iniciar sesión</h2><label>Usuario<input name="username" autocomplete="username" required></label><label>Contraseña<input name="password" type="password" autocomplete="current-password" required></label><button>Entrar</button></form><p id="msg" role="status"></p><section id="panel" hidden>
<div class="tools"><label id="sourceLabel">Informe <select id="source"><option value="real">Datos de la empresa</option><option value="demo">Demostración</option></select></label>
<button id="reload">Actualizar</button><button id="logout">Cerrar sesión</button></div>
<div class="summary-grid" id="overview">
  <article class="monthly"><h2>Resultado del mes</h2><div id="monthOutput" aria-live="polite"></div></article>
  <article class="daily"><h2>Consulta por fecha</h2>
    <div class="query"><label>Período<select id="days">
      <option value="today">Hoy</option><option value="yesterday">Ayer</option><option value="date">Elegir un día</option>
      <option value="range">Rango personalizado</option><option value="7">Últimos 7 días</option>
      <option value="30">Últimos 30 días</option><option value="90">Últimos 90 días</option></select></label>
      <label id="fromLabel" hidden><span id="fromTitle">Fecha</span><input type="date" id="from"></label>
      <label id="toLabel" hidden>Hasta<input type="date" id="to"></label>
      <button id="apply" hidden>Consultar</button></div>
    <div id="dayOutput" aria-live="polite"></div>
  </article>
</div>
<div class="tools"><button id="excel" disabled>Descargar Excel del período</button></div>
<div id="report"></div></section></main><script>
const $=id=>document.getElementById(id),role='jefe';
let token=sessionStorage.getItem('consulta_token'),revision=0;
const fmt=n=>new Intl.NumberFormat('es-BO',{maximumFractionDigits:2}).format(Number(n) === 0 ? 0 : n);
const bs=n=>n==null?'Pendiente':'Bs '+fmt(n);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function table(cols,rows,empty){return rows.length?'<div class="scroll"><table><thead><tr>'+cols.map(c=>'<th>'+esc(c)+'</th>').join('')+'</tr></thead><tbody>'+rows.map(row=>'<tr>'+row.map(c=>'<td>'+esc(c)+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>':'<p>'+empty+'</p>'}
function card(title,body){return '<section class="card"><h2>'+title+'</h2>'+body+'</section>'}
function end(){revision++;clearDetail();$('monthOutput').replaceChildren();sessionStorage.removeItem('consulta_token');token=null;$('panel').hidden=true;$('report').textContent='';$('login').hidden=false;}
async function api(url,options={}){const r=await fetch(url,{...options,headers:{'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{})}});if(!r.ok){const e=await r.json().catch(()=>({}));if(r.status===401)end();throw Error(typeof e.detail==='string'?e.detail:'Consulta no disponible')}return r}
const tile=(label,value,amount=null)=>'<div>'+label+'<strong class="'+(amount>0?'gain':amount<0?'loss':'')+'">'+value+'</strong></div>';
function informeDemostracion() {
  const lotes = [
    {codigo:'PIÑ-01', producto:'Piña', ventas:160, costo:80, gastos:20, gasto_principal:{concepto:'Transporte',monto:20}, resultado:60},
    {codigo:'BAN-02', producto:'Banano', ventas:300, costo:280, gastos:60, gasto_principal:{concepto:'Transporte',monto:45}, resultado:-40}
  ];
  return {
    actual:{desde:'2026-10-27',hasta:'2026-11-25',actividad:true,ventas:460,costo:360,gastos:80,resultado:20,generales:0,lotes,conceptos:{Transporte:65,Embalaje:15}},
    anterior:{desde:'2026-09-27',hasta:'2026-10-26',actividad:true,ventas:500,costo:340,gastos:60,resultado:100,conceptos:{Transporte:50,Embalaje:10}},
    hechos:[
      {fecha:'2026-11-07',lote:'PIÑ-01',tipo:'Rechazo',cantidad:8,unidad:'piezas',motivo:'Golpes detectados en recepción'},
      {fecha:'2026-11-16',lote:'BAN-02',tipo:'Merma',cantidad:2,unidad:'cajas',motivo:'Maduración durante el almacenamiento'}
    ],
    campo:{rendimientos:[
      {parcela:'Chaco Norte · P1',producto:'Piña',unidad:'piezas',actual:920,anterior:800,cambio_pct:15},
      {parcela:'Chaco Sur · P2',producto:'Banano',unidad:'cajas',actual:100,anterior:125,cambio_pct:-20}
    ],actividades:[
      {fecha:'2026-10-29',parcela:'Chaco Norte · P1',tipo:'Abono',detalle:'Aplicación de compost',insumo:'Compost',dosis:25,unidad_dosis:'kg/ha'},
      {fecha:'2026-11-07',parcela:'Chaco Norte · P1',tipo:'Cosecha',detalle:'92 piñas aceptadas',lote:'PIÑ-01',area_ha:0.1},
      {fecha:'2026-11-14',parcela:'Chaco Sur · P2',tipo:'Cosecha',detalle:'20 cajas aceptadas',lote:'BAN-02',area_ha:0.2}
    ]},pendientes:[]
  };
}
function fechaCorta(fecha) {
  return new Intl.DateTimeFormat('es-BO',{day:'numeric',month:'short',year:'numeric',timeZone:'UTC'}).format(new Date(fecha+'T12:00:00Z'));
}
function explicarLote(lote, hechos) {
  const {ventas, costo, gastos, resultado} = lote;
  const titulo = resultado == null ? 'No se pudo calcular el resultado' : resultado > 0 ? 'Ganancia: '+bs(resultado) : resultado < 0 ? 'Pérdida: '+bs(Math.abs(resultado)) : 'Ingresos y costos iguales';
  const frases = [];
  if (resultado == null) {
    frases.push('Ventas registradas: '+bs(ventas)+'. Los registros de costos o de recepción están incompletos para este corte.');
  } else {
    const total = Number(costo) + Number(gastos);
    const balance = resultado > 0 ? ' superaron en '+bs(resultado) : resultado < 0 ? ' quedaron '+bs(Math.abs(resultado))+' por debajo de' : ' igualaron';
    frases.push('Las ventas de '+bs(ventas)+balance+' los costos registrados de '+bs(total)+'.');
    frases.push('El costo de las salidas fue '+bs(costo)+' y los gastos adicionales sumaron '+bs(gastos)+'.');
  }
  if(lote.gasto_principal) frases.push('Mayor gasto adicional: '+lote.gasto_principal.concepto+' ('+bs(lote.gasto_principal.monto)+').');
  for(const h of hechos.filter(h=>h.lote===lote.codigo)){
    frases.push(h.tipo+' registrado: '+fmt(h.cantidad)+' '+h.unidad+' por '+h.motivo+'.');
  }
  return '<section class="'+(resultado<0?'negativa':'')+'"><small>'+esc(lote.codigo)+' · '+esc(lote.producto)+'</small><h3>'+esc(titulo)+'</h3><p>'+esc(frases.join(' '))+'</p></section>';
}
function explicarVariacion(actual, anterior) {
  if(actual.resultado == null || anterior.resultado == null) return 'La comparación requiere un resultado calculado en ambos períodos.';
  const delta=actual.resultado-anterior.resultado;
  const frases=[delta===0?'El resultado se mantuvo en '+bs(actual.resultado)+'.':'El resultado '+(delta>0?'subió':'bajó')+' en '+bs(Math.abs(delta))+', de '+bs(anterior.resultado)+' a '+bs(actual.resultado)+'.'];
  const factores=[['Las ventas','aumentaron','disminuyeron','ventas',1],['El costo de salidas','aumentó','disminuyó','costo',-1],['Los gastos operativos','aumentaron','disminuyeron','gastos',-1]];
  factores.map(([nombre,sube,baja,k,signo])=>({nombre,sube,baja,cambio:actual[k]-anterior[k],signo}))
    .filter(x=>x.cambio!==0).sort((x,y)=>Math.abs(y.cambio)-Math.abs(x.cambio))
    .forEach(x=>frases.push(x.nombre+' '+(x.cambio>0?x.sube:x.baja)+' en '+bs(Math.abs(x.cambio))+', lo que '+(x.cambio*x.signo>0?'mejoró':'redujo')+' el margen.'));
  return frases.join(' ');
}


function draw(d, demo=false){
  const a=d.actual, b=d.anterior;
  const delta=a.resultado!=null && b.resultado!=null ? a.resultado-b.resultado : null;
  const signed=n=> n==null?'—':(n>0?'+':'')+bs(n);
  const monto=n=>n==null?'Sin calcular':bs(n);
  const periodo=p=>fechaCorta(p.desde)+' – '+fechaCorta(p.hasta);
  const metrics='<div class="tiles">'+tile('Ventas registradas',bs(a.ventas))+tile('Costo de salidas',monto(a.costo))+tile('Gastos operativos',bs(a.gastos))+tile('Resultado neto registrado',monto(a.resultado),a.resultado)+'</div>';
  const filas=[['Ventas','ventas',1],['Costo de salidas','costo',-1],['Gastos operativos','gastos',-1],['Resultado del período','resultado',1]];
  const comparativo=table(['Indicador','Período actual','Período anterior','Impacto en el resultado'],filas.map(([nombre,k,sign])=>[nombre,monto(a[k]),monto(b[k]),a.actividad&&b.actividad&&a[k]!=null&&b[k]!=null?signed(sign*(a[k]-b[k])):'—']),'');
  const lotes=[...a.lotes].sort((x,y)=>(y.resultado??-Infinity)-(x.resultado??-Infinity));
  const fichas='<div class="casegrid">'+lotes.map(l=>explicarLote(l,d.hechos)).join('')+'</div>';
  const causas=explicarVariacion(a,b);
  const conceptos=[...new Set([...Object.keys(a.conceptos),...Object.keys(b.conceptos)])];
  $('report').innerHTML='<div class="reporthead"><small>'+(demo?'DEMOSTRACIÓN · DOS LOTES':'REGISTROS DE LA EMPRESA')+'</small><h2>Detalle del período</h2><p>'+periodo(a)+'</p></div>'+metrics+
    card('Resultado por lote',fichas+table(['Lote','Producto','Ventas','Costo de salidas','Gastos','Resultado'],lotes.map(l=>[l.codigo,l.producto,bs(l.ventas),monto(l.costo),bs(l.gastos),monto(l.resultado)]),'Sin actividad por lote en este período.')+(a.generales?'<p>Gastos generales sin asignación a lote: '+bs(a.generales)+'.</p>':''))+
    card('Variación del resultado','<p>Período de referencia: '+periodo(b)+'.</p>'+comparativo+(causas?'<p class="analysis">'+causas+'</p>':''))+
    card('Distribución del gasto',table(['Concepto','Actual','Anterior'],conceptos.map(k=>[k,bs(a.conceptos[k]||0),bs(b.conceptos[k]||0)]),'Sin gastos registrados.'))+
    card('Incidencias registradas',table(['Fecha','Lote','Tipo','Cantidad','Motivo registrado'],d.hechos.map(h=>[fechaCorta(h.fecha),h.lote,h.tipo,fmt(h.cantidad)+' '+h.unidad,h.motivo]),'Sin incidencias registradas.'))+
    card('Rendimiento por parcela',table(['Parcela','Producto','Unidad','Actual','Anterior','Variación'],d.campo.rendimientos.map(r=>[r.parcela,r.producto,r.unidad+'/ha',r.actual==null?'—':fmt(r.actual),r.anterior==null?'—':fmt(r.anterior),r.cambio_pct==null?'—':fmt(r.cambio_pct)+' %']),'Sin mediciones para este período.'))+
    card('Bitácora de campo',table(['Fecha','Parcela','Actividad','Observación','Detalle'],d.campo.actividades.map(r=>[fechaCorta(r.fecha),r.parcela,r.tipo,r.detalle,r.insumo?r.insumo+' · '+r.dosis+' '+r.unidad_dosis:r.lote?r.lote+' · '+r.area_ha+' ha':'—']),'Sin anotaciones para este período.'))+
    (d.pendientes.length?'<details class="card"><summary>Revisión de costos · '+d.pendientes.length+' lotes</summary>'+table(['Lote','Estado'],d.pendientes.map(l=>[l.codigo,l.motivo]),'')+'</details>':'');
}

let displayed = null;
let monthDay = '';
function balance(p) {
  if (!p.actividad) return '<strong class="balance">Sin actividad</strong>';
  if (p.resultado == null) return '<strong class="balance pending">Resultado pendiente</strong>';
  const amount = Number(p.resultado);
  if (amount === 0) return '<strong class="balance">En equilibrio · '+bs(0)+'</strong>';
  return '<strong class="balance '+(amount>0?'positive':'negative')+'">'+(amount>0?'Ganancia':'Pérdida')+' · '+bs(Math.abs(amount))+'</strong>';
}
const rangeText = p => p.desde === p.hasta ? fechaCorta(p.desde) : fechaCorta(p.desde)+' – '+fechaCorta(p.hasta);
function renderMonth({actual:a, anterior:b}) {
  const delta = a.resultado == null || b.resultado == null ? null : a.resultado - b.resultado;
  const diff = delta == null ? 'Pendiente' : (delta>0?'+':'') + bs(delta);
  const note = delta == null ? 'Hay costos pendientes en uno de los dos períodos. La variación se podrá calcular cuando estén completos.' : explicarVariacion(a,b);
  $('monthOutput').innerHTML = '<p class="dates">'+rangeText(a)+'</p>'+balance(a)+
    '<dl class="comparison"><div><dt>Mes anterior comparable</dt><dd>'+bs(b.resultado)+'</dd><dt>'+rangeText(b)+'</dt></div>'+
    '<div><dt>Diferencia</dt><dd>'+diff+'</dd></div></dl><p>'+esc(note)+'</p>';
}
function renderDay(d) {
  const p = d.actual;
  const sentence = 'Ventas de '+bs(p.ventas)+', costo de salidas '+(p.costo==null?'pendiente':bs(p.costo))+
    ' y gastos de '+bs(p.gastos)+'. Recepciones registradas: '+d.recepciones+
    '. Despachos registrados: '+d.despachos+'.'+(p.actividad && p.resultado==null?' Faltan datos de costos para calcular el resultado.':'');
  $('dayOutput').innerHTML='<p class="dates">'+rangeText(p)+'</p>'+balance(p)+'<p>'+esc(sentence)+'</p>';
}
function configureDates() {
  const mode=$('days').value;
  const calendar=mode==='date'||mode==='range';
  $('fromLabel').hidden=!calendar;
  $('toLabel').hidden=mode!=='range';
  $('apply').hidden=!calendar;
  $('fromTitle').textContent=mode==='range'?'Desde':'Fecha';
}
function queryForSelection(today) {
  const mode=$('days').value;
  if (/^\d+$/.test(mode)) return new URLSearchParams({dias:mode});
  let start=today, end=today;
  if (mode==='yesterday') {
    const day=new Date(today+'T12:00:00Z');
    day.setUTCDate(day.getUTCDate()-1);
    start=end=day.toISOString().slice(0,10);
  } else if (mode==='date'||mode==='range') {
    start=$('from').value;
    end=mode==='range'?$('to').value:start;
  }
  if (!start || !end || start>end || end>today) throw Error('Elige un rango válido hasta hoy.');
  return new URLSearchParams({desde:start,hasta:end});
}
function clearDetail() {
  displayed=null;
  $('excel').disabled=true;
  $('report').replaceChildren();
  $('dayOutput').textContent='';
}
async function load(silent=false) {
  const id=++revision;
  const demo=$('source').value==='demo';
  $('overview').hidden=demo;
  $('excel').hidden=demo;
  $('reload').hidden=demo;
  if (demo) { clearDetail();draw(informeDemostracion(),true);$('msg').textContent='';return; }
  if (silent!==true) { clearDetail();$('dayOutput').textContent='Consultando…'; }
  try {
    const month=await (await api('/direccion/mensual')).json();
    if (id!==revision) return;
    monthDay=month.actual.hasta;
    renderMonth(month);
    for(const key of ['from','to']) {
      $(key).max=monthDay;
      if(!$(key).value) $(key).value=monthDay;
    }
    const query=queryForSelection(monthDay);
    const data=await(await api('/direccion/resumen?'+query)).json();
    if(id!==revision) return;
    renderDay(data);
    draw(data);
    displayed={desde:data.actual.desde,hasta:data.actual.hasta};
    $('excel').disabled=false;
    $('msg').textContent='Actualizado a las '+new Date().toLocaleTimeString('es-BO')+' · Actualización automática cada 30 s';
  } catch(error) {
    if(id!==revision) return;
    clearDetail();$('msg').textContent=error.message;
  }
}
async function openPanel(){const u=await(await api('/auth/me')).json();if(u.rol!==role){end();throw Error('Esta cuenta no corresponde a este acceso.')} $('login').hidden=true;$('panel').hidden=false;await load()}
$('login').onsubmit=async e=>{e.preventDefault();try{const data=Object.fromEntries(new FormData(e.target));const r=await(await api('/auth/login',{method:'POST',body:JSON.stringify(data)})).json();if(r.usuario.rol!==role)throw Error('Utiliza el acceso de tu rol desde el centro de accesos.');token=r.access_token;sessionStorage.setItem('consulta_token',token);e.target.reset();await openPanel()}catch(err){$('msg').textContent=err.message}};
$('excel').onclick=async()=>{
  if(!displayed)return;
  const period={...displayed};
  try {
    const response=await api('/direccion/excel-periodo?'+new URLSearchParams(period));
    const url=URL.createObjectURL(await response.blob());
    const a=document.createElement('a');
    a.href=url;a.download='Lotes_'+period.desde+'_'+period.hasta+'.xlsx';a.click();
    setTimeout(()=>URL.revokeObjectURL(url),1000);
  } catch(e){$('msg').textContent=e.message}
};
$('reload').onclick=()=>load();
$('days').onchange=()=>{configureDates();load()};
$('apply').onclick=()=>load();
$('logout').onclick=()=>{end();$('msg').textContent=''};
$('source').onchange=()=>load();
function theme(value){
  document.documentElement.dataset.theme=value;
  $('theme').textContent=value==='dark'?'Tema claro':'Tema oscuro';
}
theme(localStorage.getItem('direccion-tema') || (matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'));
$('theme').onclick=()=>{
  const next=document.documentElement.dataset.theme==='dark'?'light':'dark';
  localStorage.setItem('direccion-tema',next);theme(next);
};
